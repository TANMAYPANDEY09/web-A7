<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
</head>

<body>

    <h1>Login</h1>

    <form action="AboutMe.html">

        <label>Username:</label>
        <input type="text"
                placeholder="Enter your username"
               name="username"
               minlength="3"
               maxlength="20"
               required>
        <br><br>

        <label>Password:</label>
        <input type="password" placeholder="Enter your password" minlength="8" 
  maxlength="20"  pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$" 
  title="Password must be 8-20 characters long and include both
   letters and numbers."
  required>
        <br><br>
        <button type="Submit">Login</button> <br><br>
        <a href="REGISTRATION.html">Not Registered? Register Here</a>

    </form>

    
</body>
</html>
